<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Proto 01 — Constellation Astrale · JAHARTA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #02030a;
    --cyan: #00e5ff; --violet: #b06eff; --gold: #ffd60a;
    --text: #e2e6f0; --text2: #9aa0b8; --muted: #5a7a90;
  }
  body {
    font-family: 'Rajdhani', sans-serif;
    background: radial-gradient(ellipse at center, #0a0f24 0%, var(--bg) 70%);
    color: var(--text); height: 100vh; overflow: hidden;
  }
  .proto-header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 18px 28px; z-index: 100;
    display: flex; align-items: center; gap: 20px;
    background: linear-gradient(180deg, rgba(2,3,10,0.96), transparent);
  }
  .proto-back {
    font-family: 'Share Tech Mono', monospace;
    font-size: .68rem; letter-spacing: .2em;
    color: var(--cyan); text-decoration: none;
    padding: 8px 14px; border: 1px solid rgba(0,229,255,0.3);
    border-radius: 4px; transition: all .2s;
  }
  .proto-back:hover { background: rgba(0,229,255,0.1); }
  .proto-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: .25em; color: var(--cyan); }
  .proto-tag { font-family: 'Share Tech Mono', monospace; font-size: .62rem; letter-spacing: .2em; color: var(--text2); margin-bottom: 2px; }
  .voie-banner {
    margin-left: auto; text-align: right;
  }
  .voie-name { font-family: 'Orbitron', sans-serif; font-size: .9rem; letter-spacing: .2em; color: var(--violet); font-weight: 700; }
  .voie-focus { font-family: 'Share Tech Mono', monospace; font-size: .6rem; color: var(--text2); letter-spacing: .15em; }
  .stage {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: 1fr 380px;
  }
  .sky-wrap {
    position: relative; overflow: hidden; user-select: none;
    cursor: grab;
  }
  .sky-wrap.dragging { cursor: grabbing; }
  #sky-bg {
    position: absolute; inset: -10%;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.6) .8px, transparent .9px),
      radial-gradient(circle, rgba(255,255,255,.4) .6px, transparent .7px);
    background-size: 80px 80px, 130px 130px;
    background-position: 0 0, 40px 40px;
    opacity: .35;
  }
  #sky {
    position: absolute; inset: 0; width: 100%; height: 100%;
    transform-origin: center center;
    transition: transform .6s cubic-bezier(.16,1,.3,1);
  }
  .orbit { fill: none; stroke: rgba(0,229,255,0.10); stroke-width: 1; stroke-dasharray: 2 6; }
  .edge { fill: none; stroke: rgba(176,110,255,0.22); stroke-width: 1; transition: stroke .3s, stroke-width .3s; }
  .edge.active { stroke: rgba(0,229,255,0.65); stroke-width: 1.6; }
  .case-group { cursor: pointer; }
  .case-glow { fill: rgba(0,229,255,0.04); stroke: rgba(0,229,255,0.22); stroke-width: 1; transition: all .25s; }
  .case-star { fill: var(--muted); stroke: var(--muted); stroke-width: .8; transition: all .25s; transform-box: fill-box; transform-origin: center; }
  .case-group:hover .case-star { transform: scale(1.2); }
  .case-group.unlocked .case-star { fill: var(--cyan); stroke: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
  .case-group.unlocked .case-glow { fill: rgba(0,229,255,0.14); stroke: rgba(0,229,255,0.55); }
  .case-group.ready .case-star { fill: var(--violet); stroke: var(--violet); filter: drop-shadow(0 0 4px var(--violet)); }
  .case-group.ready .case-glow { fill: rgba(176,110,255,0.10); stroke: rgba(176,110,255,0.50); animation: pulse-ready 2.4s ease-in-out infinite; }
  .case-group.golden .case-star { fill: var(--gold); stroke: var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }
  .case-group.selected .case-glow { fill: rgba(0,229,255,0.22); stroke: var(--cyan); stroke-width: 2.2; }
  .case-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px; fill: var(--text2);
    text-anchor: middle; pointer-events: none;
    letter-spacing: .8px; text-transform: uppercase;
  }
  .case-group:hover .case-label, .case-group.selected .case-label { fill: var(--text); }
  .palier-sun .palier-core { fill: var(--gold); filter: drop-shadow(0 0 14px var(--gold)); }
  .palier-sun .palier-ring { fill: none; stroke: var(--gold); stroke-width: 1; opacity: .35; animation: rotate-slow 20s linear infinite; transform-origin: center; }
  .palier-sun .palier-ring.r2 { animation-direction: reverse; animation-duration: 30s; }
  .palier-label { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 11px; fill: var(--gold); text-anchor: middle; letter-spacing: 2.5px; }
  @keyframes pulse-ready { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
  @keyframes rotate-slow { to { transform: rotate(360deg); } }

  .info-panel { background: rgba(8,16,30,0.80); border-left: 1px solid rgba(0,229,255,0.18); padding: 90px 28px 28px; overflow-y: auto; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .info-empty {
    font-family: 'Share Tech Mono', monospace;
    color: var(--text2); font-size: .85rem; line-height: 1.7;
    padding: 16px; border: 1px dashed rgba(122,138,160,0.2);
    border-radius: 6px; text-align: center;
  }
  .info-tag { font-family: 'Share Tech Mono', monospace; font-size: .6rem; letter-spacing: .2em; color: var(--text2); margin-bottom: 8px; }
  .info-name { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--cyan); letter-spacing: .12em; margin-bottom: 22px; line-height: 1.1; }
  .info-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 18px; }
  .info-stat { background: rgba(0,229,255,0.05); border: 1px solid rgba(0,229,255,0.18); padding: 10px 12px; border-radius: 6px; }
  .info-stat-name { font-family: 'Share Tech Mono', monospace; font-size: .55rem; letter-spacing: .15em; color: var(--text2); text-transform: uppercase; }
  .info-stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: var(--cyan); font-weight: 700; }
  .info-cost { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(176,110,255,0.08); border: 1px solid rgba(176,110,255,0.3); border-radius: 6px; margin-bottom: 14px; }
  .info-cost-label { font-family: 'Share Tech Mono', monospace; font-size: .6rem; letter-spacing: .15em; color: var(--text2); text-transform: uppercase; }
  .info-cost-val { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: var(--violet); font-weight: 800; }
  .info-status { text-align: center; padding: 12px; font-family: 'Orbitron', sans-serif; font-size: .8rem; font-weight: 700; letter-spacing: .25em; border-radius: 6px; }
  .info-status.unlocked { background: rgba(0,229,255,0.12); color: var(--cyan); }
  .info-status.ready { background: rgba(176,110,255,0.16); color: var(--violet); }
  .info-status.locked { background: rgba(122,138,160,0.10); color: var(--text2); }
  .controls { position: absolute; bottom: 24px; left: 24px; display: flex; gap: 8px; z-index: 10; }
  .ctrl-btn {
    font-family: 'Share Tech Mono', monospace; font-size: .65rem; letter-spacing: .15em;
    background: rgba(8,16,30,0.85); border: 1px solid rgba(0,229,255,0.25);
    color: var(--cyan); padding: 8px 14px; border-radius: 4px;
    cursor: pointer; transition: all .2s; backdrop-filter: blur(6px);
  }
  .ctrl-btn:hover { background: rgba(0,229,255,0.12); }
</style>
</head>
<body>
<header class="proto-header">
  <a href="index.html" class="proto-back">← RETOUR</a>
  <div>
    <div class="proto-tag">// PROTO 01</div>
    <div class="proto-title">CONSTELLATION ASTRALE</div>
  </div>
  <div class="voie-banner">
    <div class="voie-name">VOIE DU GLAIVE</div>
    <div class="voie-focus">FOCUS // STR + CHA</div>
  </div>
</header>
<div class="stage">
  <div class="sky-wrap" id="sky-wrap">
    <div id="sky-bg"></div>
    <svg id="sky" viewBox="-400 -300 800 600" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="controls">
      <button class="ctrl-btn" id="reset-rot">⟲ RECENTRER</button>
    </div>
  </div>
  <aside class="info-panel">
    <div id="info"></div>
  </aside>
</div>
<script>
const VOIE = {
  name: 'VOIE DU GLAIVE', focus: 'STR + CHA', color: '#b06eff', palierName: 'CHARGE',
  cases: [
    { id:'g1',  tier:1, name:'Frappe Lourde',  cost:1,  stats:{str:2},        status:'unlocked' },
    { id:'g2',  tier:1, name:'Garde Solide',   cost:1,  stats:{res:2},        status:'unlocked' },
    { id:'g3',  tier:1, name:'Pas Pesant',     cost:1,  stats:{spd:1,str:1},  status:'unlocked' },
    { id:'g4',  tier:2, name:'Lame Acérée',    cost:2,  stats:{str:3},        status:'unlocked' },
    { id:'g5',  tier:2, name:'Riposte',        cost:2,  stats:{agi:2,str:1},  status:'ready' },
    { id:'g6',  tier:2, name:'Cri de Guerre',  cost:2,  stats:{cha:3},        status:'ready' },
    { id:'g7',  tier:3, name:'Coup Critique',  cost:3,  stats:{str:4,cha:1},  status:'locked' },
    { id:'g8',  tier:3, name:'Brise-Garde',    cost:3,  stats:{str:3,agi:2},  status:'locked' },
    { id:'g9',  tier:3, name:'Aura Martiale',  cost:3,  stats:{cha:4},        status:'locked', golden:true },
    { id:'g10', tier:4, name:'Frénésie',       cost:4,  stats:{str:5,agi:3},  status:'locked' },
    { id:'g11', tier:4, name:'Stoïcien',       cost:4,  stats:{res:5,cha:3},  status:'locked' },
    { id:'g12', tier:4, name:'Lame Brisure',   cost:4,  stats:{str:6},        status:'locked', golden:true },
    { id:'palier', tier:5, name:'CHARGE',      cost:10, status:'locked', palier:true }
  ],
  edges: [
    ['g1','g4'], ['g2','g5'], ['g3','g5'], ['g3','g6'],
    ['g4','g7'], ['g4','g8'], ['g5','g8'], ['g6','g9'],
    ['g7','g10'], ['g8','g10'], ['g8','g11'], ['g9','g11'], ['g9','g12'],
    ['g10','palier'], ['g11','palier'], ['g12','palier']
  ]
};

const TIER_RADIUS = { 1: 260, 2: 200, 3: 140, 4: 80 };
const positions = {};
const tierGroups = {};
VOIE.cases.forEach(c => { if (!c.palier) (tierGroups[c.tier] = tierGroups[c.tier] || []).push(c); });
Object.entries(tierGroups).forEach(([tier, cases]) => {
  const r = TIER_RADIUS[tier];
  const offset = (tier % 2 === 0) ? Math.PI / cases.length : 0;
  cases.forEach((c, i) => {
    const a = (i / cases.length) * Math.PI * 2 + offset - Math.PI / 2;
    positions[c.id] = { x: r * Math.cos(a), y: r * Math.sin(a) };
  });
});
positions['palier'] = { x: 0, y: 0 };

function starPoints(cx, cy, outerR, innerR, points) {
  let pts = '';
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    pts += `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)} `;
  }
  return pts.trim();
}

const svg = document.getElementById('sky');
let html = '';
[1,2,3,4].forEach(t => { html += `<circle class="orbit" cx="0" cy="0" r="${TIER_RADIUS[t]}"/>`; });
VOIE.edges.forEach(([from, to]) => {
  const a = positions[from], b = positions[to];
  if (!a || !b) return;
  const fromCase = VOIE.cases.find(c => c.id === from);
  const toCase = VOIE.cases.find(c => c.id === to);
  const active = (fromCase && fromCase.status === 'unlocked') ? ' active' : '';
  html += `<line class="edge${active}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
});
VOIE.cases.forEach(c => {
  const p = positions[c.id]; if (!p) return;
  if (c.palier) {
    html += `<g class="case-group palier-sun" data-id="${c.id}">
      <circle class="palier-ring r1" cx="${p.x}" cy="${p.y}" r="36"/>
      <circle class="palier-ring r2" cx="${p.x}" cy="${p.y}" r="26"/>
      <circle class="palier-core" cx="${p.x}" cy="${p.y}" r="13"/>
      <text class="palier-label" x="${p.x}" y="${p.y + 56}">${c.name}</text>
    </g>`;
  } else {
    const cls = `case-group ${c.status}${c.golden ? ' golden' : ''}`;
    html += `<g class="${cls}" data-id="${c.id}">
      <circle class="case-glow" cx="${p.x}" cy="${p.y}" r="14"/>
      <polygon class="case-star" points="${starPoints(p.x, p.y, 6, 2.6, 5)}"/>
      <text class="case-label" x="${p.x}" y="${p.y + 26}">${c.name}</text>
    </g>`;
  }
});
svg.innerHTML = html;

const info = document.getElementById('info');
function renderInfo(c) {
  if (!c) {
    info.innerHTML = `<div class="info-empty">Sélectionne une étoile pour voir<br>la case correspondante.</div>`;
    return;
  }
  const stats = c.stats ? Object.entries(c.stats).map(([k,v]) =>
    `<div class="info-stat"><div class="info-stat-name">${k}</div><div class="info-stat-val">+${v}</div></div>`
  ).join('') : '';
  const lbl = c.status === 'unlocked' ? 'DÉBLOQUÉ' : c.status === 'ready' ? 'PRÊT' : 'VERROUILLÉ';
  const tierTag = c.palier ? 'PALIER FINAL' : `CASE T${c.tier}${c.golden ? ' // ŒUF DORÉ' : ''}`;
  info.innerHTML = `
    <div class="info-tag">// ${tierTag}</div>
    <div class="info-name">${c.name}</div>
    ${stats ? `<div class="info-stats">${stats}</div>` : ''}
    <div class="info-cost"><div class="info-cost-label">COÛT</div><div class="info-cost-val">${c.cost} PC</div></div>
    <div class="info-status ${c.status}">${lbl}</div>
  `;
}
renderInfo(null);

svg.querySelectorAll('.case-group').forEach(g => {
  g.addEventListener('click', () => {
    svg.querySelectorAll('.case-group.selected').forEach(n => n.classList.remove('selected'));
    g.classList.add('selected');
    renderInfo(VOIE.cases.find(c => c.id === g.getAttribute('data-id')));
  });
});

// Drag-to-rotate
const wrap = document.getElementById('sky-wrap');
let rot = 0, dragging = false, startX = 0, startRot = 0;
wrap.addEventListener('pointerdown', e => {
  dragging = true; wrap.classList.add('dragging');
  startX = e.clientX; startRot = rot;
  svg.style.transition = 'none';
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  rot = startRot + (e.clientX - startX) * 0.3;
  svg.style.transform = `rotate(${rot}deg)`;
});
window.addEventListener('pointerup', () => { dragging = false; wrap.classList.remove('dragging'); svg.style.transition = ''; });
document.getElementById('reset-rot').addEventListener('click', () => { rot = 0; svg.style.transform = 'rotate(0deg)'; });
</script>
</body>
</html>
